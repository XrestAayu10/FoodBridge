<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to your AaharLink supplier, organization, or admin account." />
    <title>Log in | AaharLink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header id="site-header" class="site-header"></header>

    <main>
      <div class="container auth-shell">
        <div class="card">
          <p class="eyebrow">Welcome back</p>
          <h1>Log in to AaharLink</h1>

          <div id="form-error" class="form-error-banner hidden"></div>

          <form id="login-form" novalidate>
            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required autocomplete="email" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" required autocomplete="current-password" />
            </div>
            <button class="btn btn-primary btn-block" id="submit-button" type="submit">Log in</button>
          </form>

          <p class="auth-switch">No account yet?
            <a href="register-supplier.html">Register as supplier</a> ·
            <a href="register-org.html">Register as organization</a>
          </p>
        </div>
      </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>
    <script type="module" src="js/shared.js"></script>
    <script type="module">
      import { loginUser } from "./js/auth.js";
      import { getCurrentProfile, showToast } from "./js/shared.js";

      const form = document.getElementById("login-form");
      const errorBanner = document.getElementById("form-error");
      const submitButton = document.getElementById("submit-button");

      const ROLE_HOME = {
        supplier: "supplier/dashboard.html",
        organization: "org/browse.html",
        admin: "admin/dashboard.html",
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBanner.classList.add("hidden");
        submitButton.disabled = true;
        submitButton.textContent = "Logging in…";
        try {
          const data = new FormData(form);
          await loginUser({ email: data.get("email"), password: data.get("password") });
          const profile = await getCurrentProfile({ fresh: true });
          window.location.href = ROLE_HOME[profile?.role] || "index.html";
        } catch (error) {
          errorBanner.textContent = error.message;
          errorBanner.classList.remove("hidden");
          submitButton.disabled = false;
          submitButton.textContent = "Log in";
        }
      });
    </script>
  </body>
</html>
